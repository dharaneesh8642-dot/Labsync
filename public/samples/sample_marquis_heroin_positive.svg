<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="dropletGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#5E1242"/>
      <stop offset="85%" stop-color="#5E1242"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#eaeef2"/>
    </linearGradient>
  </defs>

  <!-- Surface Background (Field Investigation Work Mat) -->
  <rect width="600" height="600" fill="#1b222c"/>
  <rect x="15" y="15" width="570" height="570" rx="16" fill="#141a22" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Grid Matrix Pattern on Mat -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="1"/>
  </pattern>
  <rect x="25" y="25" width="550" height="550" fill="url(#grid)" opacity="0.6"/>

  <!-- Field Evidence Header Bar -->
  <rect x="35" y="35" width="530" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#38bdf8">LABSYNC FIELD CALIBRATION TEST TARGET</text>
  <text x="50" y="74" font-family="monospace" font-size="11" fill="#94a3b8">Marquis Reagent (Batch #MQ-841) | Suspected White Powder (Seizure #NZ-402)</text>

  <!-- Left: ArUco Dynamic Calibration Card -->
  <g transform="translate(45, 110)" filter="url(#shadow)">
    <!-- Calibration Card Frame -->
    <rect width="180" height="280" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Card Header -->
    <rect x="0" y="0" width="180" height="36" rx="10" fill="#0284c7"/>
    <rect x="0" y="24" width="180" height="12" fill="#0284c7"/>
    <text x="90" y="23" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">CALIBRATION CARD</text>
    
    <!-- ArUco Marker (Simulated 4x4 Fiducial Matrix) -->
    <rect x="30" y="48" width="120" height="120" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="42" y="60" width="96" height="96" fill="#000000"/>
    <!-- Marker pattern blocks -->
    <rect x="54" y="72" width="24" height="24" fill="#ffffff"/>
    <rect x="90" y="72" width="24" height="24" fill="#000000"/>
    <rect x="54" y="96" width="24" height="24" fill="#000000"/>
    <rect x="78" y="96" width="24" height="24" fill="#ffffff"/>
    <rect x="102" y="96" width="24" height="24" fill="#ffffff"/>
    <rect x="78" y="120" width="24" height="24" fill="#000000"/>

    <text x="90" y="182" font-family="monospace" font-size="9" fill="#475569" text-anchor="middle">ID: 42 (Dict 4x4_50)</text>

    <!-- Calibration Reference Patches: White, 18% Neutral Gray, Black, RGB -->
    <g transform="translate(18, 195)">
      <rect x="0" y="0" width="22" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="3"/>
      <rect x="25" y="0" width="22" height="22" fill="#7f7f7f" stroke="#94a3b8" stroke-width="1" rx="3"/>
      <rect x="50" y="0" width="22" height="22" fill="#000000" stroke="#94a3b8" stroke-width="1" rx="3"/>
      <rect x="75" y="0" width="22" height="22" fill="#dc2626" rx="3"/>
      <rect x="100" y="0" width="22" height="22" fill="#16a34a" rx="3"/>
      <rect x="125" y="0" width="22" height="22" fill="#2563eb" rx="3"/>
      
      <text x="72" y="34" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#64748b" text-anchor="middle">CIELAB 6-BAND CCM PALETTE</text>
    </g>

    <!-- BSA & Security Barcode -->
    <g transform="translate(20, 242)">
      <line x1="5" y1="0" x2="5" y2="18" stroke="#0f172a" stroke-width="2"/>
      <line x1="12" y1="0" x2="12" y2="18" stroke="#0f172a" stroke-width="3"/>
      <line x1="18" y1="0" x2="18" y2="18" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="26" y1="0" x2="26" y2="18" stroke="#0f172a" stroke-width="4"/>
      <line x1="36" y1="0" x2="36" y2="18" stroke="#0f172a" stroke-width="2"/>
      <line x1="45" y1="0" x2="45" y2="18" stroke="#0f172a" stroke-width="1"/>
      <line x1="55" y1="0" x2="55" y2="18" stroke="#0f172a" stroke-width="3"/>
      <line x1="68" y1="0" x2="68" y2="18" stroke="#0f172a" stroke-width="2"/>
      <line x1="80" y1="0" x2="80" y2="18" stroke="#0f172a" stroke-width="3"/>
      <line x1="95" y1="0" x2="95" y2="18" stroke="#0f172a" stroke-width="1"/>
      <line x1="110" y1="0" x2="110" y2="18" stroke="#0f172a" stroke-width="4"/>
      <line x1="125" y1="0" x2="125" y2="18" stroke="#0f172a" stroke-width="2"/>
      <line x1="135" y1="0" x2="135" y2="18" stroke="#0f172a" stroke-width="1.5"/>
      <text x="70" y="27" font-family="monospace" font-size="8" fill="#475569" text-anchor="middle">CARD# CC-2026-IN-09</text>
    </g>
  </g>

  <!-- Right: Porcelain Field Spot Plate with Reagent Reaction Droplet -->
  <g transform="translate(255, 110)" filter="url(#shadow)">
    <!-- Ceramic Well Plate Body -->
    <rect width="300" height="280" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Plate Label -->
    <text x="150" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="1">FIELD REACTION CAVITY WELL</text>
    
    <!-- Depression Well (Concave 3D appearance) -->
    <circle cx="150" cy="150" r="105" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="150" cy="150" r="95" fill="#f1f5f9"/>

    <!-- Reagent Reaction Fluid Droplet -->
    <ellipse cx="150" cy="150" rx="72" ry="70" fill="url(#dropletGrad)" filter="url(#shadow)"/>
    
    <!-- Surface Specular Highlights on Chemical Liquid -->
    <ellipse cx="130" cy="125" rx="18" ry="10" fill="#ffffff" opacity="0.55" transform="rotate(-25 130 125)"/>
    <circle cx="168" cy="170" r="6" fill="#ffffff" opacity="0.3"/>

    <!-- Reticle Target Alignment Crosshairs -->
    <circle cx="150" cy="150" r="28" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4, 3" opacity="0.85"/>
    <line x1="150" y1="110" x2="150" y2="132" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    <line x1="150" y1="168" x2="150" y2="190" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    <line x1="110" y1="150" x2="132" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    <line x1="168" y1="150" x2="190" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    <circle cx="150" cy="150" r="4" fill="#38bdf8"/>
    
    <text x="150" y="270" font-family="monospace" font-weight="700" font-size="10" fill="#0284c7" text-anchor="middle">PRIMARY SAMPLE SAMPLING ZONE</text>
  </g>

  <!-- Bottom: Optical Sensor Info & Result Preview -->
  <g transform="translate(35, 415)">
    <rect width="530" height="145" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Optical Metric Badges -->
    <rect x="20" y="16" width="150" height="42" rx="6" fill="#1e293b"/>
    <text x="32" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">MEASURED HEX</text>
    <text x="32" y="49" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">#5E1242</text>
    <rect x="135" y="26" width="22" height="22" rx="4" fill="#5E1242" stroke="#ffffff" stroke-width="1.5"/>

    <rect x="185" y="16" width="160" height="42" rx="6" fill="#1e293b"/>
    <text x="197" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">ARUCO HOMOGRAPHY</text>
    <text x="197" y="49" font-family="monospace" font-size="12" font-weight="bold" fill="#4ade80">LOCKED (0.98)</text>

    <rect x="360" y="16" width="150" height="42" rx="6" fill="#1e293b"/>
    <text x="372" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">LIGHTING (LUX)</text>
    <text x="372" y="49" font-family="monospace" font-size="12" font-weight="bold" fill="#facc15">520 lx (OPTIMAL)</text>

    <!-- Presumptive Summary Line -->
    <rect x="20" y="70" width="490" height="60" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <circle cx="45" cy="100" r="12" fill="#5E1242" stroke="#ffffff" stroke-width="1.5"/>
    <text x="68" y="93" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#f8fafc">Deep Violet / Purple (Heroin/Opiate Positive)</text>
    <text x="68" y="112" font-family="monospace" font-size="10" fill="#9ca3af">SHA-256 Sealable | Offline Ready | Sec 63 BSA Compliant</text>
  </g>
</svg>